model:
  default: "gpt-6-astra"
  provider: "xiaoyi-gpt-6-astra"
  base_url: "https://xiaoyiapi.xyz/v1"
  max_tokens: 2048
  default_headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
      like Gecko) Chrome/124.0.0.0 Safari/537.36
  context_length: 1000000
providers:
  xiaoyi-gpt-6-astra:
    base_url: https://xiaoyiapi.xyz/v1
    key_env: HERMES_XIAOYI_ASTRA_KEY
    api_mode: chat_completions
    model: gpt-6-astra
    models:
      gpt-6-astra:
        timeout_seconds: 120
    request_timeout_seconds: 300
    stale_timeout_seconds: 300
  xiaoyi-claude-fable-5-1:
    base_url: https://xiaoyiapi.xyz/v1
    key_env: HERMES_XIAOYI_FABLE_KEY
    api_mode: chat_completions
    model: claude-fable-5-1
    models:
      claude-fable-5-1:
        timeout_seconds: 120
    request_timeout_seconds: 300
    stale_timeout_seconds: 300
  atlascloud-grok-4.3:
    base_url: https://api.atlascloud.ai/v1
    key_env: HERMES_ATLASCLOUD_GROK_43_KEY
    api_mode: chat_completions
    model: xai/grok-4.3
    models:
      xai/grok-4.3:
        timeout_seconds: 60
  atlascloud-grok-4.6:
    base_url: https://api.atlascloud.ai/v1
    key_env: HERMES_ATLASCLOUD_GROK_46_KEY
    api_mode: chat_completions
    model: xai/grok-4.6
    models:
      xai/grok-4.6:
        timeout_seconds: 60
fallback_providers:
- provider: atlascloud-grok-4.3
  model: xai/grok-4.3
  key_env: HERMES_ATLASCLOUD_GROK_43_KEY
  base_url: https://api.atlascloud.ai/v1
- provider: atlascloud-grok-4.6
  model: xai/grok-4.6
  key_env: HERMES_ATLASCLOUD_GROK_46_KEY
  base_url: https://api.atlascloud.ai/v1
- provider: xiaoyi-claude-fable-5-1
  model: claude-fable-5-1
  key_env: HERMES_XIAOYI_FABLE_KEY
  base_url: https://xiaoyiapi.xyz/v1

agent:
  api_max_retries: 1
  reasoning_effort: high
terminal:
  backend: local
  cwd: .
  timeout: 180
compression:
  enabled: true
  threshold: 0.8
  target_ratio: 0.2
  protect_last_n: 20
memory:
  memory_enabled: true
  user_profile_enabled: true
command_allowlist:
- recursive delete
- git force push (rewrites remote history)
- execute_code
streaming: true
_config_version: 35
mcp_servers:
  xiaoyi-grok-image:
    command: node
    args:
      - F:\hermes_ui\mcp\xiaoyi-grok-image\build\index.js
    timeout: 660
    connect_timeout: 180
    env:
      API_KEY: YOUR_XIAOYI_GROK_IMAGE_KEY
      API_URL: https://xiaoyiapi.xyz/v1
      DEFAULT_IMAGE_MODEL: grok-imagine-image
      DEFAULT_IMAGE_SIZE: 2048x2048
      DEFAULT_OUTPUT_PATH: F:\hermes_ui\output
      REQUEST_TIMEOUT: '600000'
  atlascloud-seedream-v5.0-pro:
    command: node
    args:
      - F:\hermes_ui\mcp\atlascloud-seedream-v5-pro\build\index.js
    timeout: 660
    connect_timeout: 180
    env:
      API_KEY: YOUR_MCP_ATLASCLOUD_KEY
      API_URL: https://api.atlascloud.ai
      DEFAULT_IMAGE_MODEL: bytedance/seedream-v5.0-pro/text-to-image
      DEFAULT_OUTPUT_PATH: F:\hermes_ui\output
      REQUEST_TIMEOUT: '600000'
  atlascloud-seedream-v5.0-pro-edit:
    command: node
    args:
      - F:\hermes_ui\mcp\atlascloud-seedream-edit\build\index.js
    timeout: 660
    connect_timeout: 180
    env:
      API_KEY: YOUR_MCP_ATLASCLOUD_KEY
      API_URL: https://api.atlascloud.ai
      DEFAULT_EDIT_IMAGE_MODEL: bytedance/seedream-v5.0-pro/edit
      DEFAULT_OUTPUT_PATH: F:\hermes_ui\output
      REQUEST_TIMEOUT: '600000'
  atlascloud-seedream-v5.0-lite-sequential:
    command: node
    args:
      - F:\hermes_ui\mcp\atlascloud-seedream-edit-sequential\build\index.js
    timeout: 660
    connect_timeout: 180
    env:
      API_KEY: YOUR_MCP_ATLASCLOUD_KEY
      API_URL: https://api.atlascloud.ai
      DEFAULT_EDIT_IMAGE_MODEL: bytedance/seedream-v5.0-lite/edit-sequential
      DEFAULT_OUTPUT_PATH: F:\hermes_ui\output
      REQUEST_TIMEOUT: '600000'
  atlascloud-wan-edit:
    command: node
    args:
      - F:\hermes_ui\mcp\atlascloud-wan-edit\build\index.js
    timeout: 660
    connect_timeout: 180
    env:
      API_KEY: YOUR_MCP_ATLASCLOUD_KEY
      API_URL: https://api.atlascloud.ai
      DEFAULT_EDIT_IMAGE_MODEL: alibaba/wan-2.7/image-edit
      DEFAULT_OUTPUT_PATH: F:\hermes_ui\output
      REQUEST_TIMEOUT: '600000'
  atlascloud-wan-edit-pro:
    command: node
    args:
      - F:\hermes_ui\mcp\atlascloud-wan-edit-pro\build\index.js
    timeout: 660
    connect_timeout: 180
    env:
      API_KEY: YOUR_MCP_ATLASCLOUD_KEY
      API_URL: https://api.atlascloud.ai
      DEFAULT_EDIT_IMAGE_MODEL: alibaba/wan-2.7-pro/image-edit
      DEFAULT_OUTPUT_PATH: F:\hermes_ui\output
      REQUEST_TIMEOUT: '600000'
  github:
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-github'
    timeout: 300
    connect_timeout: 300
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: YOUR_GITHUB_PERSONAL_ACCESS_TOKEN

